<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f2ec">
  <meta name="description" content="Rubbish House 点赞与评论排行榜。">
  <title>每月排行榜｜垃圾房子 Rubbish House</title>
  <link rel="canonical" href="https://cozy-dodol-24777a.netlify.app/leaderboard.html">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="leaderboard">
  <div data-site-header></div>

  <main class="page shell leaderboard-page">
    <header class="page-heading">
      <div>
        <p class="eyebrow">LEADERBOARD <span>/</span> 月度排行</p>
        <h1>每月排行榜</h1>
        <p class="page-intro">每月独立结算，只统计当月发布的已审核记录。点赞和评论都算分，同一作者的多条记录合并计算。</p>
      </div>
      <div class="page-side-note">
        <p>每月奖金</p>
        <strong>第一 ¥90 · 第二 ¥60<br>第三 ¥50 · 月总奖金 ¥200</strong>
        <a class="text-link" href="rules.html">奖励规则 <span aria-hidden="true">↗</span></a>
      </div>
    </header>

    <div class="board-note">
      <span class="eyebrow">10 MONTHS / 2026-11 — 2027-08</span>
      <p>连续 10 个月，总奖金 ¥2000。每月前三名分别获得 ¥90、¥60、¥50；当月不足 3 位时按实际名次发放。</p>
    </div>

    <div class="board-months" id="boardMonths" role="tablist" aria-label="选择排行榜月份"></div>

    <section class="board" aria-labelledby="boardTitle">
      <div class="board-heading">
        <h2 id="boardTitle">本月榜单</h2>
        <span id="boardCount">正在读取…</span>
      </div>
      <div class="board-head" aria-hidden="true">
        <span>排名</span>
        <span>作者</span>
        <span>点赞</span>
        <span>评论</span>
        <span>总分</span>
      </div>
      <div id="boardState" class="board-state" aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        <span>正在计算榜单</span>
      </div>
      <div id="boardList" class="board-list"></div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="config.js"></script>
  <script src="assets/vendor/supabase.js"></script>
  <script type="module" src="js/leaderboard.js"></script>
</body>
</html>
