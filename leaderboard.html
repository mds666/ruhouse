<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f2ec">
  <meta name="description" content="Rubbish House 点赞与评论排行榜。">
  <title>排行榜｜垃圾房子 Rubbish House</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="leaderboard">
  <div data-site-header></div>

  <main class="page shell leaderboard-page">
    <header class="page-heading">
      <div>
        <p class="eyebrow">LEADERBOARD <span>/</span> 点赞与评论</p>
        <h1>排行榜</h1>
        <p class="page-intro">只统计已通过审核的记录。收到的点赞和评论都算分；同一作者的多条记录合并计算。</p>
      </div>
      <div class="page-side-note">
        <p>计分方式</p>
        <strong>点赞 ×1 + 评论 ×1<br>同一作者合并计算</strong>
        <a class="text-link" href="rules.html">首月奖励规则 <span aria-hidden="true">↗</span></a>
      </div>
    </header>

    <div class="board-note">
      <span class="eyebrow">FIRST MONTH / 2026-11</span>
      <p>首月 100 元奖励按 2026 年 11 月的累计分数结算。这个页面展示当前累计榜，方便随时查看位置。</p>
    </div>

    <section class="board" aria-labelledby="boardTitle">
      <div class="board-heading">
        <h2 id="boardTitle">当前榜单</h2>
        <span id="boardCount">正在读取…</span>
      </div>
      <div class="board-head" aria-hidden="true">
        <span>排名</span>
        <span>作者</span>
        <span>点赞</span>
        <span>评论</span>
        <span>总分</span>
      </div>
      <div id="boardState" class="board-state" aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        <span>正在计算榜单</span>
      </div>
      <div id="boardList" class="board-list"></div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="config.js"></script>
  <script src="assets/vendor/supabase.js"></script>
  <script type="module" src="js/leaderboard.js"></script>
</body>
</html>
