<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f2ec">
  <meta name="description" content="查看一条经过审核的匿名租房房间记录。">
  <title>房间记录｜垃圾房子 Rubbish House</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="post">
  <div data-site-header></div>

  <main class="page shell article-page">
    <a class="back-link" href="wall.html"><span aria-hidden="true">←</span> 返回避雷墙</a>
    <div id="articleState" class="article-state" aria-live="polite">
      <span class="loader" aria-hidden="true"></span>
      <span>正在读取房间记录</span>
    </div>
    <article id="articleRoot" hidden></article>
  </main>

  <dialog class="dialog" id="commentReportDialog" aria-labelledby="commentReportTitle">
    <form class="dialog__panel" id="commentReportForm">
      <div class="dialog__head">
        <div>
          <p class="eyebrow">REPORT <span>/</span> 举报评论</p>
          <h2 id="commentReportTitle">举报这条评论</h2>
        </div>
        <button class="icon-button" type="button" data-close-report aria-label="关闭">×</button>
      </div>
      <p class="dialog__intro" id="reportedCommentPreview"></p>
      <label class="field">
        <span class="field__label"><span>举报原因 <b>必填</b></span></span>
        <select id="commentReportReason">
          <option value="隐私信息">泄露隐私信息</option>
          <option value="人身攻击">人身攻击或辱骂</option>
          <option value="广告引流">广告或引流</option>
          <option value="不实信息">不实信息</option>
          <option value="其他">其他</option>
        </select>
      </label>
      <p class="form-hint">举报后这条评论会立即下架，等待管理员审核。审核通过后会恢复，并取消后续重复举报。</p>
      <p class="form-hint form-hint--error" id="commentReportError" hidden></p>
      <div class="dialog__actions">
        <button class="btn btn--outline" type="button" data-close-report>取消</button>
        <button class="btn btn--danger" type="submit" id="commentReportConfirm">确认举报</button>
      </div>
    </form>
  </dialog>

  <div data-site-footer></div>

  <script src="config.js"></script>
  <script src="assets/vendor/supabase.js"></script>
  <script type="module" src="js/post.js"></script>
</body>
</html>
